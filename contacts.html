<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kaloyan Krastev</title>

    <!-- Original Favicon Configuration -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2265%%22 font-size=%2265%22 font-family=%22monospace%22 font-weight=%22700%22 letter-spacing=%22-5%22 fill=%22%23ff5502%22 text-anchor=%22middle%22>KK</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* Pure Nothing OS Monochromatic & Industrial Orange Variables */
        :root {
            --bg-main: #000000;          
            --text-primary: #ffffff;     
            --text-secondary: #666666;   
            --border-industrial: #222222;
            --accent-red: #ff0000;       
            --accent-orange: #ff5502;    
            --font-mono: 'JetBrains Mono', monospace;
            --font-dot: 'Share Tech Mono', monospace;
            --transition-tactile: 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            --transition-spring: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        /* Light Theme Token Overrides */
        body.light-theme {
            --bg-main: #ffffff;          
            --text-primary: #000000;     
            --text-secondary: #777777;   
            --border-industrial: #e5e5e5;
            --accent-orange: #d14300;    
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-mono);
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
            transition: background-color var(--transition-tactile), color var(--transition-tactile);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.light-theme .lang-menu,
        body.light-theme .contact-row {
            background: #fafafa;
        }

        body.light-theme .lang-option-btn:hover {
            background: #f0f0f2;
        }

        body.light-theme .lang-option-btn.active {
            background: rgba(209, 67, 0, 0.08);
        }

        /* Pinned Tactile Top Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-industrial);
            z-index: 1000;
            transition: background-color var(--transition-tactile), border-color var(--transition-tactile), transform 0.4s ease;
            animation: navSlideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(-100%);
        }

        @keyframes navSlideDown {
            to { transform: translateY(0); }
        }

        body.light-theme .navbar {
            background: rgba(255, 255, 255, 0.85);
        }

        .nav-logo {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-logo::before {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--accent-red);
            border-radius: 50%;
        }

        .nav-right-container {
            display: flex;
            align-items: center;
            gap: 3rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            transition: color var(--transition-tactile);
        }

        .nav-links a:hover {
            color: var(--accent-orange);
        }

        .lang-dropdown-wrapper {
            position: relative;
            border-left: 1px solid var(--border-industrial);
            padding-left: 1.5rem;
            transition: border-color var(--transition-tactile);
        }

        .lang-trigger-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: color var(--transition-tactile);
        }

        .lang-trigger-btn:hover {
            color: var(--text-primary);
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 1rem);
            right: 0;
            background: #0a0a0a;
            border: 1px solid var(--border-industrial);
            border-radius: 8px;
            padding: 0.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 80px;
            opacity: 0;
            transform: translateY(-8px) scale(0.95);
            pointer-events: none;
            transition: opacity var(--transition-tactile), transform var(--transition-tactile);
        }

        .lang-dropdown-wrapper.open .lang-menu {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .lang-option-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            text-align: left;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background var(--transition-tactile), color var(--transition-tactile);
        }

        .lang-option-btn:hover {
            background: #141414;
            color: var(--text-primary);
        }

        .lang-option-btn.active {
            color: var(--accent-orange);
            background: rgba(255, 85, 2, 0.08);
            pointer-events: none;
        }

        /* Container Configuration */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10rem 2rem 4rem 2rem;
        }

        /* Spring-driven layout entry */
        .animate-fade-up {
            opacity: 0;
            transform: translateY(15px);
            animation: hardwareReveal var(--transition-spring) forwards;
        }

        .page-header h1 {
            animation-delay: 0.1s;
        }

        .page-header p {
            animation-delay: 0.15s;
        }

        .contact-stack {
            animation-delay: 0.2s;
        }

        @keyframes hardwareReveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header {
            margin-bottom: 4rem;
        }

        .page-header h1 {
            font-family: var(--font-dot);
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0.02em;
            margin-bottom: 1rem;
            text-transform: uppercase;
            color: var(--accent-orange);
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Modular Industrial Hardware Widget Stack */
        .contact-stack {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .contact-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0a;
            border: 1px solid var(--border-industrial);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            
            /* Setting up the mechanical physics loop */
            transition: border-color var(--transition-tactile), background var(--transition-tactile), transform var(--transition-spring);
            transform-origin: center center;
        }

        .contact-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            transition: color var(--transition-tactile);
        }

        .contact-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Snappy hardware hover response updates */
        .contact-row:hover {
            border-color: var(--accent-orange);
            background: rgba(255, 85, 2, 0.01);
            transform: scale(1.015);
        }
        body.light-theme .contact-row:hover {
            background: rgba(209, 67, 0, 0.01);
        }

        .contact-row:hover .contact-label {
            color: var(--accent-orange);
        }

        .contact-row:active {
            transform: scale(0.99);
            transition: transform 0.05s ease;
        }

        /* Nothing OS Capsule Toast Alert */
        .toast-card {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #000000;
            padding: 0.6rem 1.5rem;
            border-radius: 24px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: bottom var(--transition-spring), opacity var(--transition-tactile);
        }
        body.light-theme .toast-card {
            background: #000000;
            color: #ffffff;
        }

        .toast-card.active {
            bottom: 2.5rem;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .contact-row { flex-direction: column; align-items: flex-start; gap: 0.5rem; padding: 1.25rem 1.5rem; border-radius: 8px; }
            .nav-right-container { gap: 1.5rem; }
            .lang-dropdown-wrapper { padding-left: 0.75rem; }
            .nav-links { gap: 1.25rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">Kaloyan Krastev</a>
        <div class="nav-right-container">
            <div class="nav-links">
                <a href="index.html#projects" id="lnk-capabilities">Capabilities</a>
                <a href="changelog.html" id="lnk-changelog">Changelog</a>
                <a href="contacts.html" id="lnk-contact">Contact</a>
            </div>
            
            <div class="lang-dropdown-wrapper" id="langDropdown">
                <button class="lang-trigger-btn" onclick="toggleLangMenu(event)" id="activeLangLabel">EN</button>
                <div class="lang-menu">
                    <button class="lang-option-btn" onclick="switchLanguage('en')" id="btn-lang-en">EN</button>
                    <button class="lang-option-btn" onclick="switchLanguage('bg')" id="btn-lang-bg">BG</button>
                    <button class="lang-option-btn" onclick="switchLanguage('ru')" id="btn-lang-ru">RU</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1 id="hdr-title" class="animate-fade-up">Communications</h1>
            <p id="hdr-desc" class="animate-fade-up">Connect for systems architecture planning, full-stack utility development, or infrastructure auditing.</p>
        </header>

        <section class="contact-stack animate-fade-up">
            <a href="https://github.com/kaloyansys32" target="_blank" rel="noopener noreferrer" class="contact-row">
                <span class="contact-label" id="lbl-source">Source Control</span>
                <span class="contact-value">github.com/kaloyansys32</span>
            </a>

            <div class="contact-row" onclick="copyEmailAddress(this)">
                <span class="contact-label" id="lbl-email">Email Interface</span>
                <span class="contact-value" id="emailValue">contactim4theone@gmail.com</span>
            </div>

            <a href="https://t.me/yourusername" target="_blank" rel="noopener noreferrer" class="contact-row">
                <span class="contact-label" id="lbl-direct">Direct Line</span>
                <span class="contact-value">Telegram DM</span>
            </a>
        </section>
    </main>

    <div id="copyToast" class="toast-card">Copied to Clipboard</div>

    <script>
        const translations = {
            en: {
                lnkCapabilities: "Capabilities",
                lnkChangelog: "Changelog",
                lnkContact: "Contact",
                hdrTitle: "Communications",
                hdrDesc: "Connect for systems architecture planning, full-stack utility development, or infrastructure auditing.",
                lblSource: "Source Control",
                lblEmail: "Email Interface",
                lblDirect: "Direct Line",
                toastTxt: "Copied to Clipboard"
            },
            bg: {
                lnkCapabilities: "Възможности",
                lnkChangelog: "Хронология",
                lnkContact: "Контакт",
                hdrTitle: "Комуникация",
                hdrDesc: "Свържете се за планиране на системна архитектура, разработка на софтуерни инструменти или одит на инфраструктура.",
                lblSource: "Изходен Код",
                lblEmail: "Електронна Поща",
                lblDirect: "Директна Връзка",
                toastTxt: "Копирано в буфера"
            },
            ru: {
                lnkCapabilities: "Возможности",
                lnkChangelog: "Хронология",
                lnkContact: "Контакты",
                hdrTitle: "Связь",
                hdrDesc: "Свяжитесь для проектирования системной архитектуры, разработки утилит или аудита инфраструктуры.",
                lblSource: "Исходный Код",
                lblEmail: "Электронная Почта",
                lblDirect: "Прямая Связь",
                toastTxt: "Скопировано в буфер"
            }
        };

        const COOKIE_LANG_NAME = "portfolio_lang";
        let toastTimeout = null;
        let activeToastText = "Copied to Clipboard";

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "")  + expires + "; path=/; SameSite=Strict";
        }

        function initSystemTheme() {
            const themeMediaQuery = window.matchMedia('(prefers-color-scheme: light)');
            const applyTheme = (isLight) => {
                if (isLight) {
                    document.body.classList.add('light-theme');
                } else {
                    document.body.classList.remove('light-theme');
                }
            };
            applyTheme(themeMediaQuery.matches);
            themeMediaQuery.addEventListener('change', (e) => {
                applyTheme(e.matches);
            });
        }

        function toggleLangMenu(event) {
            event.stopPropagation();
            document.getElementById('langDropdown').classList.toggle('open');
        }

        function applyLanguageStrings(lang) {
            const dictionary = translations[lang] || translations.en;
            
            document.getElementById('lnk-capabilities').innerText = dictionary.lnkCapabilities;
            document.getElementById('lnk-changelog').innerText = dictionary.lnkChangelog;
            document.getElementById('lnk-contact').innerText = dictionary.lnkContact;
            document.getElementById('hdr-title').innerText = dictionary.hdrTitle;
            document.getElementById('hdr-desc').innerText = dictionary.hdrDesc;
            document.getElementById('lbl-source').innerText = dictionary.lblSource;
            document.getElementById('lbl-email').innerText = dictionary.lblEmail;
            document.getElementById('lbl-direct').innerText = dictionary.lblDirect;
            
            activeToastText = dictionary.toastTxt;

            document.querySelectorAll('.lang-option-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-lang-${lang}`).classList.add('active');
            document.getElementById('activeLangLabel').innerText = lang.toUpperCase();
            
            document.documentElement.lang = lang;
        }

        function switchLanguage(lang) {
            setCookie(COOKIE_LANG_NAME, lang, 365);
            applyLanguageStrings(lang);
            document.getElementById('langDropdown').classList.remove('open');
        }

        function copyEmailAddress(element) {
            const emailText = document.getElementById('emailValue').innerText;
            navigator.clipboard.writeText(emailText).then(() => {
                const toast = document.getElementById('copyToast');
                toast.innerText = activeToastText;
                
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                    toast.classList.remove('active');
                }
                
                setTimeout(() => { toast.classList.add('active'); }, 50);
                toastTimeout = setTimeout(() => { toast.classList.remove('active'); }, 2500);
            }).catch(err => { console.error('Clipboard fault: ', err); });
        }

        document.addEventListener('click', function() {
            document.getElementById('langDropdown').classList.remove('open');
        });

        window.onload = function() {
            initSystemTheme();
            const userLang = getCookie(COOKIE_LANG_NAME) || 'en';
            applyLanguageStrings(userLang);
        };
    </script>
</body>
</html>
