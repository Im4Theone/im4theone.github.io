<style>
:root {
    --bg-base: #070708;
    --surface-panel: #0c0c0e;
    --surface-card: #0e0e11;
    --border-subtle: #1a1a24;
    --border-active: #22222e;
    --border-input: #1c1c26;
    --text-heading: #e4e4e7;
    --text-body: #94a3b8;
    --text-muted: #475569;
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--bg-base);
    color: var(--text-body);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

::selection {
    background: rgba(148, 163, 184, 0.1);
    color: var(--text-heading);
}

.subtle-grid {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 700px;
    background-image: linear-gradient(var(--border-subtle) 1px, transparent 1px), linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
    background-size: 56px 56px;
    z-index: 0;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0));
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0));
    opacity: 0.2;
}

nav {
    position: fixed;
    top: 0; left: 0; width: 100%;
    z-index: 1000;
    background: rgba(7, 7, 8, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-subtle);
}

.nav-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 2rem;
    height: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-logo {
    color: var(--text-heading);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
}

.nav-links {
    display: flex;
    gap: 2rem;
}

nav a.nav-link {
    color: var(--text-body);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

nav a.nav-link:hover, nav a.nav-link.active {
    color: var(--text-heading);
}

.menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text-heading);
    cursor: pointer;
}

.container {
    max-width: 750px;
    margin: 0 auto;
    padding: 0 2rem;
    position: relative;
    z-index: 1;
}

.changelog-section {
    padding-top: 180px;
    padding-bottom: 120px;
}

.changelog-header {
    margin-bottom: 4rem;
}

.changelog-header h1 {
    font-size: clamp(2.25rem, 5vw, 3.25rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
    color: var(--text-heading);
}

.log-grid {
    display: flex;
    flex-direction: column;
    gap: 2rem;
}

.changelog-card {
    background: var(--surface-card);
    border: 1px solid var(--border-active);
    border-radius: 8px;
    padding: 2.5rem;
    box-shadow: 0 4px 24px -8px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.47s cubic-bezier(0.215, 0.610, 0.355, 1.000), transform 0.47s cubic-bezier(0.215, 0.610, 0.355, 1.000);
    will-change: transform, opacity;
}

.changelog-card.visible {
    opacity: 1;
    transform: translateY(0);
}

.card-meta {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.25rem;
}

.version-tag {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-heading);
    background: #14141a;
    border: 1px solid #2d2d3f;
    padding: 3px 10px;
    border-radius: 4px;
}

.release-date {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-muted);
}

.release-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-heading);
    letter-spacing: -0.01em;
    margin-bottom: 1.5rem;
}

.commit-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
}

.commit-item {
    font-size: 15px;
    color: var(--text-body);
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    line-height: 1.5;
}

.commit-type {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    min-width: 54px;
    display: inline-block;
}

.type-add { color: #cbd5e1; }
.type-fix { color: #94a3b8; }
.type-opt { color: #475569; }

footer {
    border-top: 1px solid var(--border-subtle);
    padding: 3rem 0;
    background: var(--bg-base);
}

.footer-wrapper {
    max-width: 750px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
}

.btn-github {
    background: #0f0f13;
    border: 1px solid #22222e;
    color: var(--text-heading);
    padding: 10px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: background-color 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-github:hover {
    background: #14141a;
    border-color: #35354a;
    transform: translateY(-2px);
}

.btn-github svg { fill: currentColor; }

.changelog-header {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.47s cubic-bezier(0.215, 0.610, 0.355, 1.000), transform 0.47s cubic-bezier(0.215, 0.610, 0.355, 1.000);
}

.changelog-header.visible {
    opacity: 1;
    transform: translateY(0);
}

@media (max-width: 768px) {
    .menu-toggle { display: block; }
    .nav-links {
        display: none;
        flex-direction: column;
        position: fixed;
        top: 64px; left: 0; width: 100%; height: calc(100vh - 64px);
        background: var(--bg-base);
        padding: 2rem;
        gap: 1.5rem;
        border-top: 1px solid var(--border-subtle);
    }
    .nav-links.open { display: flex; }
    .footer-wrapper { flex-direction: column; gap: 1.5rem; text-align: center; }
}
</style>

<script>
    const lenis = new Lenis({
        duration: 1.17,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        direction: 'vertical',
        gestureDirection: 'vertical',
        smooth: true,
        mouseMultiplier: 0.8,
        smoothTouch: false,
        touchMultiplier: 1.5,
        infinite: false,
    });

    function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    const toggleBtn = document.getElementById('menu-toggle');
    const navLinksContainer = document.getElementById('nav-links');
    toggleBtn.addEventListener('click', () => navLinksContainer.classList.toggle('open'));

    const container = document.getElementById('changelog-container');

    const observerOptions = { threshold: 0.02, rootMargin: '0px 0px -20px 0px' };
    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, observerOptions);

    observer.observe(document.getElementById('changelog-title'));

    async function compileLogs() {
        try {
            const manifestResponse = await fetch('changelog-manifest.json');
            if (!manifestResponse.ok) return;
            const jsonFiles = await manifestResponse.json();

            for (const file of jsonFiles) {
                const response = await fetch(`changelogs/${file}`);
                if (!response.ok) continue;
                const data = await response.json();
                
                const card = document.createElement('div');
                card.className = 'changelog-card';
                
                let commitItems = '';
                data.commits.forEach(commit => {
                    commitItems += `
                        <li class="commit-item">
                            <span class="commit-type type-${commit.type}">[${commit.type}]</span>
                            <span>${escapeHTML(commit.body)}</span>
                        </li>
                    `;
                });

                card.innerHTML = `
                    <div class="card-meta">
                        <span class="version-tag">${escapeHTML(data.version)}</span>
                        <span class="release-date">${escapeHTML(data.date)}</span>
                    </div>
                    <h2 class="release-title">${escapeHTML(data.title)}</h2>
                    <ul class="commit-list">${commitItems}</ul>
                `;
                
                container.appendChild(card);
                observer.observe(card);
            }
        } catch (err) {
            console.error('Failed to parse log files:', err);
        }
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.addEventListener('DOMContentLoaded', compileLogs);
</script>
