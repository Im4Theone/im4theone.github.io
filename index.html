<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaloyan Krastev | Systems</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2265%%22 font-size=%2265%22 font-family=%22monospace%22 font-weight=%22700%22 letter-spacing=%22-5%22 fill=%22%23ff5502%22 text-anchor=%22middle%22>KK</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* Pure Nothing OS Monochromatic & Industrial Orange Variables */
        :root {
            --bg-main: #000000;          
            --text-primary: #ffffff;     
            --text-secondary: #666666;   
            --border-industrial: #222222;
            --accent-red: #ff0000;       
            --accent-orange: #ff5502;    
            --font-mono: 'JetBrains Mono', monospace;
            --font-dot: 'Share Tech Mono', monospace;
            
            /* Nothing OS Signature Spring/Tactile Cubic Bezier Curve */
            --transition-tactile: 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            --transition-spring: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        /* Light Theme Token Overrides */
        body.light-theme {
            --bg-main: #ffffff;          
            --text-primary: #000000;     
            --text-secondary: #777777;   
            --border-industrial: #e5e5e5;
            --accent-orange: #d14300;    
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-mono);
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
            transition: background-color var(--transition-tactile), color var(--transition-tactile);
            overflow-x: hidden;
        }

        /* Nothing Style Boot Layer */
        #bootOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000; 
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
        }

        .boot-terminal {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-align: center;
            user-select: none;
        }

        .boot-row {
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .boot-row.visible { 
            opacity: 1; 
            transform: translateY(0);
        }

        /* Hardware Flashing Glyph Node - Runs 3 perfect pulses */
        .boot-glyph {
            width: 10px;
            height: 10px;
            background-color: var(--accent-orange);
            border-radius: 50%;
            opacity: 0;
        }

        body.boot-initializing .boot-glyph {
            animation: hardwarePulse 0.3s cubic-bezier(0.25, 1, 0.5, 1) alternate 6 forwards;
        }

        @keyframes hardwarePulse {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 8px var(--accent-orange); }
        }

        body.light-theme .lang-menu {
            background: #fafafa;
        }

        body.light-theme .lang-option-btn:hover {
            background: #f0f0f2;
        }

        body.light-theme .lang-option-btn.active {
            background: rgba(209, 67, 0, 0.08);
        }

        /* Pinned Top Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-industrial);
            z-index: 1000;
            transition: background-color var(--transition-tactile), border-color var(--transition-tactile), transform 0.4s ease;
            
            /* Slide down navigation panel entry */
            animation: navSlideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(-100%);
        }

        @keyframes navSlideDown {
            to { transform: translateY(0); }
        }

        body.light-theme .navbar {
            background: rgba(255, 255, 255, 0.85);
        }

        .nav-logo {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-logo::before {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--accent-red);
            border-radius: 50%;
        }

        .nav-right-container {
            display: flex;
            align-items: center;
            gap: 3rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            transition: color var(--transition-tactile);
            position: relative;
        }

        .nav-links a:hover {
            color: var(--accent-orange);
        }

        /* Language Dropdown */
        .lang-dropdown-wrapper {
            position: relative;
            border-left: 1px solid var(--border-industrial);
            padding-left: 1.5rem;
            transition: border-color var(--transition-tactile);
        }

        .lang-trigger-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: color var(--transition-tactile);
        }

        .lang-trigger-btn:hover {
            color: var(--text-primary);
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 1rem);
            right: 0;
            background: #0a0a0a;
            border: 1px solid var(--border-industrial);
            border-radius: 8px;
            padding: 0.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 80px;
            opacity: 0;
            transform: translateY(-8px) scale(0.95);
            pointer-events: none;
            transition: opacity var(--transition-tactile), transform var(--transition-tactile);
        }

        .lang-dropdown-wrapper.open .lang-menu {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .lang-option-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            text-align: left;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background var(--transition-tactile), color var(--transition-tactile);
        }

        .lang-option-btn:hover {
            background: #141414;
            color: var(--text-primary);
        }

        .lang-option-btn.active {
            color: var(--accent-orange);
            background: rgba(255, 85, 2, 0.08);
            pointer-events: none;
        }

        /* Main Container Layout with Stagger Animation triggers */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 10rem 2rem 4rem 2rem;
        }

        /* Spring-loaded layout reveal blocks */
        .animate-fade-up {
            opacity: 0;
            transform: translateY(15px);
        }

        body.boot-complete .animate-fade-up {
            animation: hardwareReveal var(--transition-spring) forwards;
        }

        body.boot-complete .hero h1 { animation-delay: 0.05s; }
        body.boot-complete .hero p { animation-delay: 0.12s; }

        @keyframes hardwareReveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Clean Solid Typography */
        .hero h1 {
            font-family: var(--font-dot);
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0.02em;
            margin-bottom: 2rem;
            text-transform: uppercase;
            color: var(--accent-orange);
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.7;
            max-width: 750px;
            transition: color var(--transition-tactile);
        }

        @media (max-width: 768px) {
            .nav-right-container { gap: 1.5rem; }
            .lang-dropdown-wrapper { padding-left: 0.75rem; }
            .nav-links { gap: 1.25rem; }
        }
    </style>
</head>
<body>

    <div id="bootOverlay">
        <div class="boot-glyph"></div>
        <div class="boot-terminal">
            <div class="boot-row" id="bootRowWelcome"><span>WELCOME</span></div>
        </div>
    </div>

    <nav class="navbar">
        <a href="#home" class="nav-logo">Kaloyan Krastev</a>
        <div class="nav-right-container">
            <div class="nav-links">
                <a href="#home" id="lnk-capabilities">Capabilities</a>
                <a href="https://github.com/kaloyansys32/kaloyansys32.github.io/releases" target="_blank" id="lnk-changelog">Changelog</a>
                <a href="contacts.html" id="lnk-contact">Contact</a>
            </div>
            
            <div class="lang-dropdown-wrapper" id="langDropdown">
                <button class="lang-trigger-btn" onclick="toggleLangMenu(event)" id="activeLangLabel">EN</button>
                <div class="lang-menu">
                    <button class="lang-option-btn" onclick="switchLanguage('en')" id="btn-lang-en">EN</button>
                    <button class="lang-option-btn" onclick="switchLanguage('bg')" id="btn-lang-bg">BG</button>
                    <button class="lang-option-btn" onclick="switchLanguage('ru')" id="btn-lang-ru">RU</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" id="home">
        <section class="hero">
            <h1 id="hero-title" class="animate-fade-up">High-performance automation logic and backend infrastructure.</h1>
            <p id="hero-desc" class="animate-fade-up">Engineered by Kaloyan Krastev. Scalable system architectures, clean database migration pipelines, and performance-tuned software scripts built for processing speed.</p>
        </section>
    </main>

    <script>
        const translations = {
            en: {
                lnkCapabilities: "Capabilities",
                lnkChangelog: "Changelog",
                lnkContact: "Contact",
                heroTitle: "High-performance automation logic and backend infrastructure.",
                heroDesc: "Engineered by Kaloyan Krastev. Scalable system architectures, clean database migration pipelines, and performance-tuned software scripts built for processing speed."
            },
            bg: {
                lnkCapabilities: "Възможности",
                lnkChangelog: "Хронология",
                lnkContact: "Контакт",
                heroTitle: "Високопроизводителна логика за автоматизация и бекенд инфраструктура.",
                heroDesc: "Разработено от Калоян Кръстев. Мащабируеми системни архитектури, чисти конвейери за миграция на бази данни и софтуерни скриптове, оптимизирани за максимална скорост на обработка."
            },
            ru: {
                lnkCapabilities: "Возможности",
                lnkChangelog: "Хронология",
                lnkContact: "Контакты",
                heroTitle: "Высокопроизводительная логика автоматизации и бэкенд-инфраструктура.",
                heroDesc: "Выполнено Калояном Крастевым. Масштабируемые системные архитектуры, чистые конвейеры миграции баз данных и программные скрипты, оптимизированные для максимальной скорости обработки."
            }
        };

        const COOKIE_LANG_NAME = "portfolio_lang";

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "")  + expires + "; path=/; SameSite=Strict";
        }

        // Auto-match user light/dark system settings
        function initSystemTheme() {
            const themeMediaQuery = window.matchMedia('(prefers-color-scheme: light)');
            const applyTheme = (isLight) => {
                if (isLight) {
                    document.body.classList.add('light-theme');
                } else {
                    document.body.classList.remove('light-theme');
                }
            };
            applyTheme(themeMediaQuery.matches);
            themeMediaQuery.addEventListener('change', (e) => {
                applyTheme(e.matches);
            });
        }

        // Hardware Boot Engine with Event Listener
        function executeHardwareBoot() {
            const overlay = document.getElementById('bootOverlay');
            const glyph = document.querySelector('.boot-glyph');
            
            if (sessionStorage.getItem('portfolio_booted')) {
                if (overlay) overlay.remove();
                document.body.classList.add('boot-complete');
                return;
            }

            document.body.classList.add('boot-initializing');

            setTimeout(() => {
                const welcomeRow = document.getElementById('bootRowWelcome');
                if (welcomeRow) welcomeRow.classList.add('visible');
            }, 150);

            if (glyph) {
                glyph.addEventListener('animationend', () => {
                    setTimeout(() => {
                        if (overlay) overlay.style.transform = 'translateY(-100%)';
                        document.body.classList.add('boot-complete');
                        sessionStorage.setItem('portfolio_booted', 'true');
                    }, 100);

                    setTimeout(() => {
                        if (overlay) overlay.remove();
                    }, 500);
                });
            }
        }

        function toggleLangMenu(event) {
            event.stopPropagation();
            document.getElementById('langDropdown').classList.toggle('open');
        }

        function applyLanguageStrings(lang) {
            const dictionary = translations[lang] || translations.en;
            
            document.getElementById('lnk-capabilities').innerText = dictionary.lnkCapabilities;
            document.getElementById('lnk-changelog').innerText = dictionary.lnkChangelog;
            document.getElementById('lnk-contact').innerText = dictionary.lnkContact;
            document.getElementById('hero-title').innerText = dictionary.heroTitle;
            document.getElementById('hero-desc').innerText = dictionary.heroDesc;

            document.querySelectorAll('.lang-option-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-lang-${lang}`).classList.add('active');
            document.getElementById('activeLangLabel').innerText = lang.toUpperCase();
            
            document.documentElement.lang = lang;
        }

        function switchLanguage(lang) {
            setCookie(COOKIE_LANG_NAME, lang, 365);
            applyLanguageStrings(lang);
            document.getElementById('langDropdown').classList.remove('open');
        }

        document.addEventListener('click', function() {
            document.getElementById('langDropdown').classList.remove('open');
        });

        window.onload = function() {
            const userLang = getCookie(COOKIE_LANG_NAME) || 'en';
            initSystemTheme();
            executeHardwareBoot();
            applyLanguageStrings(userLang);
        };
    </script>
</body>
</html>
